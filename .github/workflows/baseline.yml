name: Publish build baseline

# One-off service workflow. It copies the pinned gadget payload (the portable
# ZIP originally published with v1.0.0) to a dedicated pre-release named
# "build-baseline", so scripts/build.py no longer depends on a user-facing
# release. It runs only when the "build-baseline" tag is pushed and refuses to
# publish anything whose SHA-256 differs from the pinned one.

on:
  push:
    tags:
      - "build-baseline"

permissions:
  contents: write

concurrency:
  group: build-baseline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ASSET: Win7WeatherGadget-Portable.zip
      SOURCE_TAG: v1.0.0
      SHA256: 2fe82e2271cc051b5a170e31fc06a48fa901483a5e6f4409d146770dedb0b40d
    steps:
      - name: Copy the pinned payload to the build-baseline release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          if gh release view build-baseline >/dev/null 2>&1; then
            gh release download build-baseline --pattern "$ASSET" --dir payload
            echo "$SHA256  payload/$ASSET" | sha256sum -c -
            echo "build-baseline already holds the pinned payload; nothing to do."
            exit 0
          fi
          gh release download "$SOURCE_TAG" --pattern "$ASSET" --dir payload
          echo "$SHA256  payload/$ASSET" | sha256sum -c -
          cat > notes.md <<'EOF'
          Service release used only by the build (`scripts/build.py`): it holds the
          pinned gadget baseline that every build verifies by SHA-256. It is not meant
          for users; download the latest release instead.

          Do not delete this release and never replace its asset: the build would fail.
          EOF
          gh release create build-baseline "payload/$ASSET" \
            --verify-tag --prerelease --latest=false \
            --title "Build baseline (not for users)" \
            --notes-file notes.md
          gh release download build-baseline --pattern "$ASSET" --dir check
          echo "$SHA256  check/$ASSET" | sha256sum -c -
