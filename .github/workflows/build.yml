# Build, test and release the Windows 7 Weather Gadget.
#
# Every push / pull request: structure and localization checks, JavaScript and
# Python tests, installer build with Inno Setup, tests against the packaged
# gadget, upload of the build as a workflow artifact.
# Tag vX.Y.Z (matching the VERSION file): the same, plus a GitHub release with
# exactly two assets: Win7WeatherGadget-Setup.exe and
# Win7WeatherGadget-Portable.zip.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  INNO_VERSION: "6.7.3"
  INNO_URL: "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $v = '${{ steps.version.outputs.version }}'
          if ($tag -ne "v$v") { throw "Tag $tag does not match VERSION $v" }

      - name: Validate structure and the 20 gadget languages
        run: python scripts/check_localization.py

      - name: Install test dependencies
        run: npm ci

      - name: JavaScript validation and tests
        run: npm test

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup installation failed ($($p.ExitCode))" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer, gadget and ZIP
        env:
          APP_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build.py --require-installer

      - name: Python tests (repository, localization, packages, installer)
        run: python scripts/run_tests.py

      - name: JavaScript tests against the packaged gadget
        run: node tests/js/run_all.cjs --gadget dist/stage/gadget/Weather.gadget

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Win7WeatherGadget-${{ steps.version.outputs.version }}
          path: |
            dist/Win7WeatherGadget-Setup.exe
            dist/Win7WeatherGadget-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Win7WeatherGadget-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = "${{ needs.build.outputs.version }}"
          m = re.search(r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          body = m.group(1).strip() if m else "Release " + version
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          title='Windows 7 Weather Gadget ${{ needs.build.outputs.version }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Win7WeatherGadget-Setup.exe dist/Win7WeatherGadget-Portable.zip --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" dist/Win7WeatherGadget-Setup.exe dist/Win7WeatherGadget-Portable.zip --title "$title" --notes-file release-notes.md --verify-tag
          fi
